services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap
      POSTGRES_DB: cap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local IdP for OIDC testing. Disable if using Dev Login only.
  # keycloak:
  #   image: quay.io/keycloak/keycloak:26.0
  #   command: ["start-dev", "--http-port=8081"]
  #   environment:
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #   ports:
  #     - "8081:8081"

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://cap:cap@postgres:5432/cap?sslmode=disable
      DATA_ROOT: /data/workspaces
      SESSION_SECRET: dev-session-secret-change-me-please
      DATA_ENCRYPTION_KEY: dev-data-encryption-key-32b-min!!
      CORS_ORIGINS: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      DEV_AUTH_ENABLED: "true"
      CODING_TOOLS_IMAGE: coding-tools-mcp:local
      DOCKER_NETWORK: agent-internal
      PERMISSION_MODE: trusted
      DEFAULT_OPENAI_BASE_URL: ${DEFAULT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEFAULT_OPENAI_API_KEY: ${DEFAULT_OPENAI_API_KEY:-}
      DEFAULT_OPENAI_MODEL: ${DEFAULT_OPENAI_MODEL:-gpt-4o-mini}
      # OIDC_ISSUER: http://localhost:8081/realms/cap
      # OIDC_CLIENT_ID: coding-agent-platform
      # OIDC_CLIENT_SECRET: change-me
      # OIDC_REDIRECT_URL: http://localhost:8080/api/v1/auth/oidc/callback
    volumes:
      - ../data/workspaces:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # API needs to reach user containers on agent-internal and manage docker.
    # Join default network + external agent-internal created by API on first start.

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
