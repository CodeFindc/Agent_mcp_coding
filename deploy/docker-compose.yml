services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap
      POSTGRES_DB: cap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://cap:cap@postgres:5432/cap?sslmode=disable
      DATA_ROOT: /data/workspaces
      SESSION_SECRET: dev-session-secret-change-me-please
      DATA_ENCRYPTION_KEY: dev-data-encryption-key-32b-min!!
      CORS_ORIGINS: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      DEV_AUTH_ENABLED: "true"
      CODING_TOOLS_IMAGE: coding-tools-mcp:local
      DOCKER_NETWORK: agent-internal
      PERMISSION_MODE: trusted
      RUNTIME_IDLE_MINUTES: "30"
      MAX_RUNNING_RUNTIMES_PER_USER: "3"
      DEFAULT_OPENAI_BASE_URL: ${DEFAULT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEFAULT_OPENAI_API_KEY: ${DEFAULT_OPENAI_API_KEY:-}
      DEFAULT_OPENAI_MODEL: ${DEFAULT_OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ../data/workspaces:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        NEXT_PUBLIC_API_BASE: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
